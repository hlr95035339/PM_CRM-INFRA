<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Dashboard</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #11203b;
      --muted: #60708a;
      --primary: #2563eb;
      --primary-dark: #1749b7;
      --border: #d8e0ec;
      --success: #0f766e;
      --accent: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #eef4ff, #f7f9fc);
      color: var(--text);
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 2rem;
    }

    .badge {
      background: #e0f2fe;
      color: #075985;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-card,
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .summary-card {
      padding: 18px;
    }

    .summary-card h3 {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.92rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .summary-card p {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      padding: 18px;
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 14px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: 700;
    }

    input, select, button {
      width: 100%;
      padding: 11px 12px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    button:hover {
      background: var(--primary-dark);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
      font-size: 0.94rem;
    }

    th {
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #e0f2fe;
      color: #075985;
      font-size: 0.78rem;
      font-weight: 700;
    }

    #message {
      min-height: 24px;
      margin-top: 6px;
      font-weight: 700;
      color: var(--success);
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <section id="loginSection" class="card">
      <h2>CRM Login</h2>
      <form id="loginForm">
        <label>Username</label>
        <input name="username" value="admin" required />
        <label>Password</label>
        <input name="password" type="password" value="crm123" required />
        <button type="submit">Sign in</button>
      </form>
    </section>

    <div id="crmApp" class="hidden">
      <div class="topbar">
        <h1>CRM Dashboard</h1>
        <div class="badge">Live customer operations</div>
      </div>

      <section class="summary-grid">
        <div class="summary-card">
          <h3>Customers</h3>
          <p id="customerCount">0</p>
        </div>
        <div class="summary-card">
          <h3>Open Tickets</h3>
          <p id="ticketCount">0</p>
        </div>
        <div class="summary-card">
          <h3>Orders</h3>
          <p id="orderCount">0</p>
        </div>
      </section>

      <div class="grid">
        <section class="card">
          <h2>Customer Snapshot</h2>
          <div id="customersList"></div>
          <form id="customerForm">
            <label>Name</label>
            <input name="name" placeholder="Alice" required />
            <label>Email</label>
            <input name="email" type="email" placeholder="alice@test.com" required />
            <button type="submit">Add Customer</button>
          </form>
        </section>

        <section class="card">
          <h2>Create Order</h2>
          <form id="orderForm">
            <label>Customer ID</label>
            <input name="customerId" type="number" min="1" required />
            <label>Total</label>
            <input name="total" type="number" min="0" step="0.01" required />
            <label>Status</label>
            <select name="status">
              <option value="pending">Pending</option>
              <option value="shipped">Shipped</option>
              <option value="completed">Completed</option>
            </select>
            <button type="submit">Create Order</button>
          </form>
        </section>

        <section class="card">
          <h2>Submit Ticket</h2>
          <form id="ticketForm">
            <label>Customer ID</label>
            <input name="customerId" type="number" min="1" required />
            <label>Title</label>
            <input name="title" placeholder="Billing issue" required />
            <label>Status</label>
            <select name="status">
              <option value="open">Open</option>
              <option value="pending">Pending</option>
              <option value="closed">Closed</option>
            </select>
            <button type="submit">Submit Ticket</button>
          </form>
        </section>
      </div>

      <div class="grid">
        <section class="card">
          <h2>Customer Directory</h2>
          <div id="customersTable"></div>
        </section>

        <section class="card">
          <h2>Orders</h2>
          <div id="ordersTable"></div>
        </section>

        <section class="card">
          <h2>Ticket Queue</h2>
          <div id="ticketsTable"></div>
        </section>
      </div>

      <div id="message"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
